name: Desktop Builds

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tauri_bundles: appimage,deb
          - os: windows-latest
            tauri_bundles: nsis,msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run tauri:build -w @landrop/app -- --bundles ${{ matrix.tauri_bundles }}

      - name: Inspect build output
        if: always()
        shell: bash
        run: |
          echo "Top-level target directories:"
          ls -la app/src-tauri/target || true
          echo "Bundle directories:"
          find app/src-tauri/target -type d -name bundle | head -n 20 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: landrop-${{ runner.os }}-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/**
            app/src-tauri/target/*/release/bundle/**
          if-no-files-found: warn

  release:
    name: Publish Release Assets
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
